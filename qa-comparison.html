<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folio Design QA Comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 30px; background: #18191c; color: white; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      h1 { margin: 0 0 22px; font-size: 20px; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
      figure { margin: 0; padding: 14px; border-radius: 16px; background: #25262a; }
      figcaption { margin-bottom: 10px; color: #c8c9ce; }
      img { display: block; width: 100%; height: auto; border-radius: 10px; background: white; }
    </style>
  </head>
  <body>
    <h1>参考视觉与 Folio 实现 · 同屏比对</h1>
    <main>
      <figure><figcaption>参考图 · 1200 × 900</figcaption><img src="/reference-dashboard.png" alt="参考财务驾驶舱视觉" /></figure>
      <figure><figcaption>实现 · 1440 × 1000 首屏</figcaption><img src="/implementation-desktop-viewport-v2.png" alt="Folio 财务驾驶舱实现" /></figure>
    </main>
  </body>
</html>
